name: Music Bank webapp

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - ios-webapp
  pull_request:
    paths:
      - '.github/workflows/webapp.yml'
      - '.nvmrc'
      - 'App.tsx'
      - 'index.ts'
      - 'app.json'
      - 'package*.json'
      - 'public/**'
      - 'src/**'
      - 'assets/**'
      - 'tests/**'

permissions:
  contents: read

concurrency:
  group: webapp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-webapp:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 'true'
      EXPO_OFFLINE: '1'
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check shared app
        run: npm run check

      - name: Export webapp
        run: |
          npm run export:desktop
          for file in index.html manifest.json sw.js robots.txt icons/icon-180.png; do test -s "dist/$file"; done
          grep -q 'rel="manifest"' dist/index.html
          ls dist/_expo/static/js/web/*.js >/dev/null

      - name: Package webapp
        run: |
          mkdir -p release-output
          tar -czf release-output/MusicBank-web.tar.gz -C dist .
          (cd release-output && sha256sum MusicBank-web.tar.gz > MusicBank-web.tar.gz.sha256)
          cat release-output/MusicBank-web.tar.gz.sha256

      - name: Upload webapp
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Music-Bank-Web
          path: release-output/*
          if-no-files-found: error

      # The server polls this pre-release, which /releases/latest and the in-app update check ignore.
      - name: Publish webapp for the server
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="Webapp pubblicata dal commit $GITHUB_SHA. Il server la scarica da qui: non installarla a mano."
          if gh release view webapp -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload webapp release-output/* --clobber -R "$GITHUB_REPOSITORY"
            gh release edit webapp --notes "$notes" --prerelease -R "$GITHUB_REPOSITORY"
          else
            gh release create webapp release-output/* --target "$GITHUB_SHA" --prerelease --title "Webapp (server)" --notes "$notes" -R "$GITHUB_REPOSITORY"
          fi
