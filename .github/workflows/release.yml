name: Build and publish Android release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    # The EAS free queue can exceed 45 minutes in the evening.
    timeout-minutes: 120
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Check tag, version and release notes
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$RELEASE_TAG" != "v$version" ]; then
            echo "Tag $RELEASE_TAG does not match package version v$version." >&2
            exit 1
          fi
          test -f "docs/releases/$version.md"
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"
      - name: Verify Expo token
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "EXPO_TOKEN repository secret is missing." >&2
            exit 1
          fi
      - name: Build Android with EAS
        id: eas-build
        run: |
          build_json="$(npx eas-cli build --platform android --profile release --non-interactive --wait --json)"
          build_id="$(printf '%s' "$build_json" | jq -r '.[0].id')"
          test -n "$build_id" && test "$build_id" != "null"
          echo "build_id=$build_id" >> "$GITHUB_OUTPUT"
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      - name: Download APK
        run: |
          mkdir -p release-output
          download_json="$(npx eas-cli build:download --build-id "${{ steps.eas-build.outputs.build_id }}" --non-interactive --json)"
          apk_path="$(printf '%s' "$download_json" | jq -r '.path')"
          test -n "$apk_path" && test "$apk_path" != "null"
          mv "$apk_path" "release-output/MusicBank-${RELEASE_TAG}.apk"
          (cd release-output && sha256sum "MusicBank-${RELEASE_TAG}.apk" > "MusicBank-${RELEASE_TAG}.apk.sha256")
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      - name: Verify APK signing certificate
        run: node tools/verify-apk-certificate.mjs "release-output/MusicBank-${RELEASE_TAG}.apk"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-output/* --clobber
            gh release edit "$RELEASE_TAG" --notes-file "docs/releases/${RELEASE_VERSION}.md" --draft=false --latest
          else
            gh release create "$RELEASE_TAG" release-output/* \
              --verify-tag \
              --title "Music Bank ${RELEASE_TAG}" \
              --notes-file "docs/releases/${RELEASE_VERSION}.md" \
              --latest
          fi
