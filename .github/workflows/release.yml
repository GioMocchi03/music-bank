name: Build and publish Android release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Build Android with EAS
        id: eas-build
        run: |
          build_json="$(npx eas-cli build --platform android --profile release --non-interactive --wait --json)"
          build_id="$(printf '%s' "$build_json" | jq -r '.id')"
          test -n "$build_id" && test "$build_id" != "null"
          echo "build_id=$build_id" >> "$GITHUB_OUTPUT"
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      - name: Download APK
        run: |
          mkdir -p release-output
          npx eas-cli build:download --build-id "${{ steps.eas-build.outputs.build_id }}" --non-interactive
          apk_path="$(find . -maxdepth 2 -type f -name '*.apk' | head -n 1)"
          test -n "$apk_path"
          mv "$apk_path" "release-output/MusicBank-${GITHUB_REF_NAME}.apk"
          sha256sum "release-output/MusicBank-${GITHUB_REF_NAME}.apk" > "release-output/MusicBank-${GITHUB_REF_NAME}.apk.sha256"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" release-output/* \
            --title "Music Bank ${GITHUB_REF_NAME}" \
            --generate-notes
